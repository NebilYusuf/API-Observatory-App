name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check backend
        run: python -m py_compile app/main.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout API-Observatory-App
        uses: actions/checkout@v4

      - name: Checkout E2E tests repo
        uses: actions/checkout@v4
        with:
          repository: NebilYusuf/API-Observatory-App-E2E
          path: api-observatory-app-e2e
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install E2E dependencies
        run: npm install
        working-directory: api-observatory-app-e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: api-observatory-app-e2e

      - name: Run E2E tests
        run: npx playwright test
        working-directory: api-observatory-app-e2e

  # Single check to select in branch protection: "CI / all-checks-passed"
  all-checks-passed:
    name: all-checks-passed
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    steps:
      - name: OK
        run: echo "Backend, frontend, and e2e checks passed."